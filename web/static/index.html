<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mosh over WebRTC</title>
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32" />
    <link rel="apple-touch-icon" href="favicon.ico" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-unicode11@0.6.0/lib/xterm-addon-unicode11.js"></script>
    <script src="wasm_exec.js"></script>
    <style>
        @font-face {
            font-family: "Spleen 32x64";
            src: url("spleen-32x64.woff2") format("woff2"),
                 url("spleen-32x64.woff") format("woff");
            font-display: block;
        }
        @font-face {
            font-family: "Spleen 8x16";
            src: url("spleen-8x16.woff2") format("woff2"),
                 url("spleen-8x16.woff") format("woff");
            font-display: block;
        }
        @font-face {
            font-family: "Spleen 16x32";
            src: url("spleen-16x32.woff2") format("woff2"),
                 url("spleen-16x32.woff") format("woff");
            font-display: block;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            height: 100%;
            background-color: #1a1b26;
            color: #c0caf5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #header {
            padding: 10px 16px;
            background: #16161e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #292e42;
        }
        .title {
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .badge {
            display: inline-block;
            width: 8px;
            height: 8px;
            flex: 0 0 8px;
            border-radius: 50%;
            background-color: #f7768e;
        }
        .badge.connecting { background-color: #e0af68; }
        .badge.connected { background-color: #9ece6a; }
        #terminal-container {
            flex: 1 1 0;
            min-height: 0;
            overflow: hidden;
            padding: 8px;
            position: relative;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        @media (max-width: 600px) {
            #header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            .controls {
                flex-wrap: wrap;
                justify-content: flex-start;
            }
        }
        button {
            background: #7aa2f7;
            color: #15161e;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
        }
        select.font-select {
            background: #24283b;
            color: #c0caf5;
            border: 1px solid #414868;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            outline: none;
        }
        button:hover { background: #89b4fa; }
        button:disabled { background: #414868; color: #787c99; cursor: not-allowed; }
        button.secondary {
            background: #24283b;
            color: #c0caf5;
            border: 1px solid #414868;
        }
        button.secondary:hover { background: #2f354d; }
    </style>
</head>
<body>
    <div id="header">
        <div class="title">
            <span id="status-badge" class="badge"></span>
            <span id="status-text">Disconnected</span>
        </div>
        <div class="controls">
            <select id="font-size" class="font-select" title="Font size"></select>
            <button id="retry-btn" class="secondary" onclick="retryConnection()" style="display: none;">Retry</button>
            <button id="connect-btn" onclick="startMosh()">Connect</button>
        </div>
    </div>
    <div id="terminal-container"></div>

    <script>
        const statusBadge = document.getElementById("status-badge");
        const statusText = document.getElementById("status-text");
        const connectBtn = document.getElementById("connect-btn");
        const retryBtn = document.getElementById("retry-btn");
        const fontSelect = document.getElementById("font-size");

        // fontSize is the font's em size; Spleen's bitmap grid is half that, so
        // fontSize 16 renders 8x16 cells at 1:1 pixels (no interpolation).
        // spacing widens the cell a little; the 8x16 grid is tight otherwise.
        const FONT_PRESETS = [
            { label: "8x16 (Tiny)", family: '"Spleen 8x16", monospace', size: 16, spacing: 1 },
            { label: "16x32 (Medium)", family: '"Spleen 16x32", monospace', size: 32, spacing: 0 },
            { label: "32x64 (Large)", family: '"Spleen 32x64", monospace', size: 64, spacing: 0 }
        ];
        let currentPresetIdx = FONT_PRESETS.findIndex(
            p => p.size === Number(localStorage.getItem("mosh_font_px"))
        );
        if (currentPresetIdx < 0) currentPresetIdx = 0; // default: 8x16

        FONT_PRESETS.forEach((p, i) => {
            const opt = document.createElement("option");
            opt.value = i;
            opt.textContent = p.label;
            opt.selected = i === currentPresetIdx;
            fontSelect.appendChild(opt);
        });

        const activePreset = FONT_PRESETS[currentPresetIdx];
        const term = new Terminal({
            allowProposedApi: true,
            cursorBlink: true,
            fontSize: activePreset.size,
            fontFamily: activePreset.family,
            letterSpacing: activePreset.spacing || 0,
            theme: {
                background: '#1a1b26',
                foreground: '#c0caf5',
                cursor: '#c0caf5',
                selectionBackground: '#33467c'
            }
        });
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        const unicode11Addon = new Unicode11Addon.Unicode11Addon();
        term.loadAddon(unicode11Addon);
        term.unicode.activeVersion = '11';
        const termContainer = document.getElementById('terminal-container');
        term.open(termContainer);
        // Right click is a terminal mouse report, not a browser menu.
        termContainer.addEventListener('contextmenu', e => e.preventDefault());
        fitAddon.fit();
        // The first measure can run before the webfont is ready; re-fit once it is.
        document.fonts.ready.then(() => {
            fitAddon.fit();
            if (moshSession) moshSession.resize(term.cols, term.rows);
        });

        fontSelect.addEventListener("change", async (e) => {
            const idx = Number(e.target.value);
            const preset = FONT_PRESETS[idx];
            if (!preset) return;
            localStorage.setItem("mosh_font_px", preset.size);
            await document.fonts.load(`${preset.size}px ${preset.family.split(',')[0]}`);
            term.options.fontFamily = preset.family;
            term.options.fontSize = preset.size;
            term.options.letterSpacing = preset.spacing || 0;
            fitAddon.fit();
            if (moshSession) {
                moshSession.resize(term.cols, term.rows);
                const redraw = moshSession.redraw();
                if (redraw) term.write(redraw);
            }
            term.focus();
        });

        let lastCols = term.cols;
        let lastRows = term.rows;
        let resizeDebounce = null;

        function handleResize() {
            fitAddon.fit();
            if (term.cols === lastCols && term.rows === lastRows) return;
            lastCols = term.cols;
            lastRows = term.rows;

            if (resizeDebounce) clearTimeout(resizeDebounce);
            resizeDebounce = setTimeout(() => {
                if (moshSession) {
                    moshSession.resize(term.cols, term.rows);
                    moshSession.tick();
                }
            }, 60);
        }
        window.addEventListener('resize', handleResize);
        new ResizeObserver(handleResize).observe(document.getElementById('terminal-container'));

        let wasmLoaded = false;
        async function loadWasm() {
            if (wasmLoaded) return;
            const go = new Go();
            const fmt = n => n >= 1048576 ? (n / 1048576).toFixed(2) + " MB" : Math.ceil(n / 1024) + " KB";
            const resp = await fetch("mosh.wasm");
            const total = Number(resp.headers.get("X-File-Size") || resp.headers.get("Content-Length")) || 0;
            const chunks = [];
            let received = 0;
            const render = () => {
                statusText.textContent = `Loading Mosh WASM (${fmt(received)}${total ? "/" + fmt(total) : ""})`;
            };
            render();
            const reader = resp.body.getReader();
            for (;;) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                received += value.length;
                render();
            }
            const bytes = new Uint8Array(received);
            let off = 0;
            for (const c of chunks) { bytes.set(c, off); off += c.length; }
            const result = await WebAssembly.instantiate(bytes, go.importObject);
            go.run(result.instance);
            wasmLoaded = true;
        }

        function filterPrivateCandidates(sdp) {
            if (!sdp) return sdp;
            // Served from localhost: every candidate is host-only by definition, so
            // dropping them would leave ICE with nothing to pair.
            if (location.hostname === "localhost" || location.hostname === "127.0.0.1") return sdp;
            return sdp.split("\r\n").filter(line => {
                if (!line.startsWith("a=candidate")) return true;
                if (line.includes("typ host") || line.includes(".local")) return false;
                const parts = line.trim().split(/\s+/);
                if (parts.length >= 5) {
                    const addr = parts[4];
                    if (addr.endsWith(".local") || /^(10\.|192\.168\.|127\.|169\.254\.|0\.0\.0\.0|fe80:|fc00:|fd00:|::1)/i.test(addr)) return false;
                    if (addr.startsWith("172.")) {
                        const sub = parseInt(addr.split(".")[1], 10);
                        if (sub >= 16 && sub <= 31) return false;
                    }
                }
                return true;
            }).join("\r\n");
        }

        let moshSession = null;
        let pollTimer = null;
        let activePC = null;
        let activeDC = null;
        let currentSessionId = null;
        let isReconnecting = false;
        let termInputHooked = false;

        // The session id is a bearer token for the live PTY, so it stays in
        // sessionStorage: never the URL, never history, never proxy logs.
        function rememberSession(id) {
            try { sessionStorage.setItem("mosh_session_id", id); } catch (_) {}
        }
        function forgetSession() {
            try { sessionStorage.removeItem("mosh_session_id"); } catch (_) {}
        }

        let cachedIceServers = null;
        let cachedIceExpiry = 0;
        async function getIceServers() {
            if (cachedIceServers && Date.now() < cachedIceExpiry) {
                return cachedIceServers;
            }
            const res = await fetch("/api/config");
            const data = await res.json();
            cachedIceServers = data.iceServers;
            cachedIceExpiry = Date.now() + 60 * 60 * 1000; // cache 1h client-side
            return cachedIceServers;
        }

        async function createAndOffer(pc, sessionId = null, fresh = false) {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            await new Promise(resolve => {
                if (pc.iceGatheringState === "complete") {
                    resolve();
                } else {
                    const checkState = () => {
                        if (pc.iceGatheringState === "complete") {
                            pc.removeEventListener("icegatheringstatechange", checkState);
                            resolve();
                        }
                    };
                    pc.addEventListener("icegatheringstatechange", checkState);
                    setTimeout(resolve, 400);
                }
            });

            const cleanOfferSDP = filterPrivateCandidates(pc.localDescription.sdp);
            const res = await fetch("/api/offer", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ sdp: cleanOfferSDP, sessionId: sessionId, fresh: fresh })
            });

            if (!res.ok) {
                throw new Error(await res.text());
            }

            const data = await res.json();
            const filteredAnswer = filterPrivateCandidates(data.sdp);
            await pc.setRemoteDescription({ type: "answer", sdp: filteredAnswer });
            return data;
        }

        async function triggerReconnect(reason = "Network switch") {
            if (!currentSessionId || !moshSession || isReconnecting) return;
            isReconnecting = true;
            statusBadge.className = "badge connecting";
            statusText.textContent = `Roaming/Reconnecting (${reason})...`;

            try {
                if (activePC) {
                    try { activePC.close(); } catch (_) {}
                    activePC = null;
                }

                const iceServers = await getIceServers();

                const newPC = new RTCPeerConnection({ iceServers });
                activePC = newPC;

                const newDC = newPC.createDataChannel("mosh", {
                    ordered: false,
                    maxRetransmits: 2
                });
                newDC.binaryType = "arraybuffer";
                setupDataChannelHooks(newDC);

                setupPeerConnectionHooks(newPC);

                const data = await createAndOffer(newPC, currentSessionId);

                if (data.sessionId && data.sessionId !== currentSessionId) {
                    handleSessionTerminated("Session expired");
                    return;
                }

                await new Promise((resolve, reject) => {
                    const timer = setTimeout(() => reject(new Error("Reconnect DataChannel timeout")), 12000);
                    newDC.onopen = () => {
                        clearTimeout(timer);
                        resolve();
                    };
                    newDC.onerror = (e) => reject(e);
                });

                // Hot-swap the WebRTC DataChannel inside the running mosh-go client!
                moshSession.swapDataChannel(newDC);
                activeDC = newDC;
                isReconnecting = false;
                statusBadge.className = "badge connected";
                statusText.textContent = "Connected (Roamed)";
                retryBtn.style.display = "inline-block";
                moshSession.resize(term.cols, term.rows);
                moshSession.tick();
                // Redraw latest state to guarantee screen is refreshed after reconnection
                const redraw = moshSession.redraw();
                if (redraw) term.write(redraw);
            } catch (err) {
                console.warn("[Reconnect error]", err);
                isReconnecting = false;
                statusBadge.className = "badge";
                statusText.textContent = "Roaming failed: " + err.message;
                retryBtn.style.display = "inline-block";
            }
        }

        async function sessionAlive(id) {
            try {
                const res = await fetch("/api/session/" + encodeURIComponent(id));
                return res.status !== 404;
            } catch (_) {
                return true; // network error: assume the session is still there
            }
        }

        function setupDataChannelHooks(dc) {
            dc.onclose = async () => {
                console.log("[DataChannel] Closed");
                // Ignore channels superseded by a roam or closed by us.
                if (isReconnecting || (activeDC && dc !== activeDC)) return;
                // The server drops the session when login/shell exits; a network
                // drop leaves it alive for roaming. Only the former is terminal.
                if (currentSessionId && !(await sessionAlive(currentSessionId))) {
                    handleSessionTerminated("Shell session ended");
                    return;
                }
                statusBadge.className = "badge";
                statusText.textContent = "Disconnected";
                connectBtn.disabled = false;
                retryBtn.style.display = "inline-block";
            };
        }

        function handleSessionTerminated(msg) {
            currentSessionId = null;
            forgetSession();
            moshSession = null;
            activeDC = null;
            if (activePC) {
                try { activePC.close(); } catch (_) {}
                activePC = null;
            }
            if (pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }
            statusBadge.className = "badge";
            statusText.textContent = `${msg}. Click Connect to start a new session.`;
            connectBtn.disabled = false;
            retryBtn.style.display = "none";
        }

        function setupPeerConnectionHooks(pc) {
            pc.oniceconnectionstatechange = () => {
                if (pc !== activePC) return; // stale connection from an earlier attempt
                const state = pc.iceConnectionState;
                console.log("[ICE State]", state);
                if (state === "disconnected" || state === "failed") {
                    // Network changed, Wi-Fi dropped, or roaming
                    triggerReconnect(state);
                }
            };
        }

        // Automatic reconnection on online event (e.g., reconnecting to Wi-Fi/cellular)
        window.addEventListener("online", () => {
            console.log("[Network] Online event received");
            triggerReconnect("Online");
        });

        // ICE can sit in "connected" on a dead path (TURN permission expired, one-way
        // loss). Watch the SSP traffic itself: no incoming datagram, or unacked
        // keystrokes, for 6s means the link is dead even though ICE disagrees.
        var lastWatchdogReconnect = 0;
        function startWatchdog() {
            if (window.__mlWatchdog) return;
            window.__mlWatchdog = setInterval(() => {
                if (!moshSession || !activeDC || activeDC.readyState !== "open" || isReconnecting) return;
                if (Date.now() - lastWatchdogReconnect < 10000) return;
                const down = moshSession.sinceRecvMs();
                const up = moshSession.unackedMs();
                if (down > 6000 || up > 6000) {
                    console.log("[Watchdog] link stalled", down, up);
                    lastWatchdogReconnect = Date.now();
                    triggerReconnect("Link stalled");
                }
            }, 2000);
        }

        async function startMosh(resumeId = null) {
            connectBtn.disabled = true;
            statusBadge.className = "badge connecting";
            statusText.textContent = resumeId ? "Resuming session..." : "Initializing...";

            try {
                const iceServers = await getIceServers();

                if (activePC) {
                    try { activePC.close(); } catch (_) {}
                }

                const pc = new RTCPeerConnection({ iceServers });
                activePC = pc;
                setupPeerConnectionHooks(pc);

                const dc = pc.createDataChannel("mosh", {
                    ordered: false,
                    maxRetransmits: 2
                });
                dc.binaryType = "arraybuffer";
                activeDC = dc;
                setupDataChannelHooks(dc);

                statusText.textContent = "Connecting to gateway...";
                const data = await createAndOffer(pc, resumeId, !!resumeId);
                currentSessionId = data.sessionId;
                rememberSession(currentSessionId);

                statusText.textContent = "Awaiting WebRTC DataChannel...";
                await new Promise((resolve, reject) => {
                    const timer = setTimeout(() => reject(new Error("DataChannel open timeout")), 15000);
                    dc.onopen = () => {
                        clearTimeout(timer);
                        resolve();
                    };
                    dc.onerror = (e) => reject(e);
                });

                statusBadge.className = "badge connected";
                statusText.textContent = `Connected (mosh over WebRTC)`;
                retryBtn.style.display = "inline-block";

                fitAddon.fit();
                // Signaled first so a resume doesn't wait on the WASM download; the
                // server redraws the full screen once we attach, so nothing is lost.
                await loadWasm();
                moshSession = await moshConnectRTC(dc, data.key, term.cols, term.rows);
                moshSession.resize(term.cols, term.rows);
                startWatchdog();
                moshSession.tick();
                term.focus();

                if (!termInputHooked) {
                    termInputHooked = true;
                    term.onData(chars => {
                        if (moshSession) {
                            moshSession.send(chars);
                        }
                    });

                    term.onBinary(data => {
                        if (moshSession) {
                            moshSession.send(data);
                        }
                    });
                }

                if (pollTimer) clearInterval(pollTimer);
                pollTimer = setInterval(() => {
                    if (moshSession) {
                        moshSession.tick();
                        const output = moshSession.poll();
                        if (output) {
                            term.write(output);
                        }
                    }
                }, 16);

            } catch (err) {
                console.error(err);
                statusBadge.className = "badge";
                statusText.textContent = "Error: " + err.message;
                connectBtn.disabled = false;
                retryBtn.style.display = "inline-block";
                term.writeln("\r\n[Connection Error: " + err.message + "]");
            }
        }

        async function retryConnection() {
            if (retryBtn.disabled) return;
            retryBtn.disabled = true;

            try {
                if (currentSessionId && moshSession) {
                    // If session is alive, redraw screen and kick WebRTC reconnect
                    const redraw = moshSession.redraw();
                    if (redraw) term.write(redraw);
                    await triggerReconnect("User Retry");
                } else {
                    await startMosh();
                }
            } finally {
                // Cooldown: re-enable after 1.5s to prevent hammering TURN/signaling
                setTimeout(() => {
                    retryBtn.disabled = false;
                }, 1500);
            }
        }
        // A page refresh (or tab restore) reattaches to the shell that was already
        // running in this tab. If the shell has exited or the server reaped it,
        // forget the stale id silently and leave the UI fresh (Disconnected + Connect).
        async function resumeStoredSession() {
            let id = null;
            try {
                id = sessionStorage.getItem("mosh_session_id");
            } catch (_) {
                return; // private mode / blocked storage: just stay idle
            }
            if (!id || currentSessionId) return;
            if (!(await sessionAlive(id))) {
                forgetSession();
                return;
            }
            try {
                await startMosh(id);
            } catch (_) {
                forgetSession();
            }
        }

        document.fonts.ready.then(resumeStoredSession);

    </script>
</body>
</html>
